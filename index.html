.modal-mask.show{display:flex}
.modal-sheet{width:100%;background:#fff;border-radius:32px 32px 0 0;

.w-full{width:100%}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.flex{display:flex}.flex-1{flex:1}.gap-8{gap:8px}.gap-12{gap:12px}
.text-sub{color:#8B7D72}.text-orange{color:#FF9633}.text-green{color:#7BC67E}
.fs-12{font-size:12px}.fs-13{font-size:13px}.fs-14{font-size:14px}.fs-18{font-size:18px}
.fw-700{font-weight:700}.tac{text-align:center}
.league-big{background:#fff;border-radius:24px;padding:28px;text-align:center;

.league-big-icon{font-size:72px;margin-bottom:12px}
.league-big-name{font-size:22px;font-weight:700}

<body>

<div class="sync-bar" id="syncBar">
  <span id="syncIcon" style="font-size:16px">☁️</span>
  <span id="syncText">本地模式</span>
  <span id="syncStatus" class="sync-badge sync-offline" style="margin-left:auto">仅本地</span>
</div>

<div class="header">
  <div class="header-row">
    <span class="app-title">🐻 Work Buddy</span>
  </div>
  <div class="greeting"><span id="greeting"></span></div>
  <div class="date-badge" id="dateBadge"></div>
</div>

<div class="league-card" onclick="showLeague()">
  <span class="lg-icon" id="lgIcon">⬜</span>
  <div class="flex-1">
    <span class="lg-name" id="lgName">未定级</span>
    <div class="lg-next" id="lgNext"></div>
    <div class="lg-bar"><div class="lg-fill" id="lgFill" style="width:0%"></div></div>
  </div>
  <span class="lg-xp" id="lgXp">0 XP</span>
</div>

<div id="xpMini" class="xp-mini"><span>⭐</span><div class="xp-mini-bar"><div class="xp-mini-fill" id="xpFill" style="width:0%"></div></div><span id="xpLabel">Lv.1</span></div>

<div class="stats-row">
  <div class="stat-card"><div class="stat-num" id="doneNum">0</div><div class="stat-label">已完成</div></div>
  <div class="stat-card"><div class="stat-num" id="totalNum">0</div><div class="stat-label">总任务</div></div>
  <div class="stat-card"><div class="stat-num" id="streakNum">0</div><div class="stat-label">连续🔥</div></div>
  <div class="stat-card"><div class="stat-num" id="gemsNum">0</div><div class="stat-label">💎宝石</div></div>
</div>

<div class="tabs" id="tabs"></div>

<div id="content"></div>

<div class="fab" onclick="showQuickAdd()">+</div>

<div class="modal-mask" id="qaModal" onclick="closeQuickAdd(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="fw-700 mb-12 tac" style="font-size:17px">🐻 快速添加任务</div>
    <select id="qaMod" class="sel w-full mb-12">
      <option value="0">📚 学习</option><option value="1">💼 工作</option>
      <option value="2">🏠 生活</option><option value="3">💪 健身</option>
    </select>
    <input class="input" id="qaName" placeholder="任务名称">
    <input class="input" id="qaMeta" placeholder="时长/说明（健身模块填分钟数）">
    <div class="flex gap-12 mt-16">
      <button class="btn btn-ghost" onclick="closeQuickAdd()">取消</button>
      <button class="btn btn-primary" onclick="confirmQA()">确认添加</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="leagueModal" onclick="closeLeague(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="fw-700 mb-16 tac" style="font-size:17px">🏆 联赛晋级</div>
    <div class="league-big">
      <div class="league-big-icon" id="bigLgIcon">⬜</div>
      <div class="league-big-name" id="bigLgName">未定级</div>
      <div class="league-big-next" id="bigLgNext"></div>
      <div class="tree-bar mt-12"><div class="tree-fill" id="bigLgFill" style="width:0%"></div></div>
      <div class="text-orange fw-700 mt-12">联赛经验 <span id="bigLgXp">0</span> XP</div>
    </div>
    <div id="allLeagues"></div>
    <div class="sec-title mt-16">🏅 成就徽章</div>
    <div class="badge-grid" id="badgeGrid"></div>
    <button class="btn btn-ghost mt-16" onclick="closeLeague()">关闭</button>
  </div>
</div>

<div class="modal-mask" id="ocrModal" onclick="cancelOCR(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="fw-700 mb-12" style="font-size:17px">📷 OCR 识别结果</div>
    <div class="ocr-status" id="ocrStatus"></div>
    <div class="ocr-modal" id="ocrList"></div>
    <div class="flex gap-12 mt-16">
      <button class="btn btn-ghost" onclick="cancelOCR()">取消</button>
      <button class="btn btn-primary" onclick="confirmOCR()">录入选中项</button>
    </div>
  </div>
</div>

<script>

var SUPABASE_URL = 'https://gkznlwpdbtdazknhrlgo.supabase.co';
var SUPABASE_KEY = 'sb_publishable_nnMi6kteR-Ronp7k4g1k_g_r89bNSnY';
var SUPABASE_ENABLED = false;
var DEVICE_ID = '';

// ============ STATE ============
var DAYS = ['日','一','二','三','四','五','六'];
var LEAGUES = [
  {name:'未定级',icon:'⬜',xp:0},{name:'青铜联赛',icon:'🥉',xp:1},

  {name:'钻石联赛',icon:'💠',xp:751},{name:'王者联赛',icon:'👑',xp:1201}
];
var BADGES = [
  {id:'first',icon:'⭐',name:'首次打卡',cond:function(s){return s.lifetimeDone>=1},gems:1},
  {id:'s7',icon:'🔥',name:'七日连击',cond:function(s){return s.streak>=7},gems:1},
  {id:'s30',icon:'💎',name:'月度之星',cond:function(s){return s.streak>=30},gems:3},

  {id:'t50',icon:'🏆',name:'半百达人',cond:function(s){return s.lifetimeDone>=50},gems:3},
  {id:'all',icon:'🌟',name:'全能选手',cond:function(s){return s.mDone.l&&s.mDone.w&&s.mDone.h&&s.mDone.f},gems:2}
];
var QUESTS = [
  {id:'q1',icon:'📚',name:'完成1个学习任务',tgt:1,xp:20,gems:0,cat:'learn'},
  {id:'q2',icon:'💼',name:'完成1个工作任务',tgt:1,xp:20,gems:0,cat:'work'},
  {id:'q3',icon:'🏠',name:'完成1个生活任务',tgt:1,xp:15,gems:0,cat:'life'},
  {id:'q4',icon:'🏃',name:'完成运动记录',tgt:1,xp:15,gems:0,cat:'fitness'},
  {id:'q5',icon:'✅',name:'完成3个任意任务',tgt:3,xp:30,gems:1,cat:'any'},
  {id:'q6',icon:'💧',name:'喝满8杯水',tgt:8,xp:10,gems:0,cat:'water'}
];

var S = {
  tidCtr:60,learn:[],work:[],life:[],
  lmList:[],wmList:[],hmList:[],hobbies:[],customHabits:[],
  history:[],weight:[],exer:[],
  xp:0,level:1,streak:0,lifetimeDone:0,lifetimeXP:0,gems:0,
  lxp:0,lastDay:'',mDone:{l:false,w:false,h:false,f:false},
  earned:{},
  habits:{poop:0,water:0},
  qProg:{},qDoneD:{},qDoneW:{}
};
var _tab = 'learn';
var _collapses = {lm:false,wm:false,hm:false};

function initDefaults(){
  S.learn = [
    {id:'l1',title:'民法-合同编总论',meta:'专业课|预计2h',tag:'tag-must',done:false,at:''},
    {id:'l2',title:'英语阅读2篇+生词整理',meta:'英语|预计1.5h',tag:'tag-must',done:false,at:''},

    {id:'h1',title:'整理书桌',meta:'每日',tag:'tag-life',done:false,at:''},

  S.hmList = [
    {name:'整理书桌',f:'每日',c:'清洁'},{name:'洗衣',f:'每周三',c:'清洁'}
  ];
}

function loadState(){
  try{
    var raw = localStorage.getItem('wb_state_v4');
    if(raw){
      var s = JSON.parse(raw);
      // Merge into S (keep defaults for missing keys)
      Object.keys(s).forEach(function(k){S[k]=s[k];});
    }else{initDefaults();}
  }catch(e){initDefaults();}
}
function saveState(){
  localStorage.setItem('wb_state_v4',JSON.stringify(S));
  syncToCloud();
}
function checkDay(){
  var today = new Date().toDateString();
  if(S.lastDay!==today){
    S.lastDay = today;
    S.qProg = {}; S.qDoneD = {};
    S.habits = {poop:0,water:0}; S.exer = [];
    S.learn.forEach(function(t){t.done=false;t.at='';});
    S.work.forEach(function(t){t.done=false;t.at='';});
    S.life.forEach(function(t){t.done=false;t.at='';});
    saveState();
  }
}

// ============ Supabase Sync ============
function initSync(){
  DEVICE_ID = localStorage.getItem('wb_device_id');
  if(!DEVICE_ID){DEVICE_ID='d_'+Math.random().toString(36).substr(2,9);localStorage.setItem('wb_device_id',DEVICE_ID);}
  if(SUPABASE_URL && SUPABASE_KEY){
    SUPABASE_ENABLED = true;
    updateSyncUI();
    loadFromCloud();
  }
}
function updateSyncUI(){
  if(SUPABASE_ENABLED){
    document.getElementById('syncIcon').textContent='☁️';
    document.getElementById('syncText').textContent='云同步已启用';
    document.getElementById('syncStatus').textContent='在线';

  }
}
function syncToCloud(){
  if(!SUPABASE_ENABLED) return;
  var payload = {device_id:DEVICE_ID,data:JSON.stringify(S),updated_at:new Date().toISOString()};
  fetch(SUPABASE_URL+'/rest/v1/user_data',{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([payload])
  }).catch(function(){});
}
function loadFromCloud(){
  if(!SUPABASE_ENABLED) return;
  fetch(SUPABASE_URL+'/rest/v1/user_data?select=*&order=updated_at.desc&limit=1',{
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
  }).then(function(r){return r.json();}).then(function(rows){
    if(rows.length>0){
      try{
        var remote = JSON.parse(rows[0].data);
        var localTs = S.lastDay ? new Date(S.lastDay).getTime() : 0;
        var remoteTs = new Date(rows[0].updated_at).getTime();
        if(remoteTs > localTs){
          Object.keys(remote).forEach(function(k){S[k]=remote[k];});
          saveState();
          document.getElementById('syncText').textContent='已从云端同步最新数据';
          setTimeout(function(){updateSyncUI();},2000);
        }
      }catch(e){}
    }
  }).catch(function(err){console.log('Sync load failed:',err);});
}

// ============ HELPERS ============
function fmtDate(){
  var d=new Date();
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日·周'+DAYS[d.getDay()];
}
function fmtTime(){
  var d=new Date();
  return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}
function getLeague(){
  for(var i=LEAGUES.length-1;i>=0;i--){
    if(S.lxp>=LEAGUES[i].xp) return {cur:LEAGUES[i],idx:i,next:i<LEAGUES.length-1?LEAGUES[i+1]:null};
  }
  return {cur:LEAGUES[0],idx:0,next:LEAGUES[1]};
}
function addXP(pts){
  S.xp+=pts;S.lifetimeXP+=pts;S.lxp+=pts;
  var need=S.level*100;
  if(S.xp>=need && S.level<7){S.xp-=need;S.level++;S.gems+=S.level;showToast('升级！Lv.'+S.level);}
  checkBadges();
  saveState();
}
function checkBadges(){
  BADGES.forEach(function(b){
    if(!S.earned[b.id] && b.cond(S)){
      S.earned[b.id]=true;S.gems+=b.gems;
      showToast('解锁成就：'+b.name+'！');
    }
  });
}

function showToast(msg){
  var el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;z-index:99999;pointer-events:none';
  document.body.appendChild(el);
  setTimeout(function(){el.remove();},2000);
}

// ============ TASK TOGGLE ============
function toggleLearn(idx){
  var t=S.learn[idx];
  t.done=!t.done;
  if(t.done){t.at=fmtTime();S.lifetimeDone++;S.streak++;S.mDone.l=true;S.history.unshift({title:t.title,cat:'l',time:t.at});addXP(10);}
  else{t.at='';S.lifetimeDone=Math.max(0,S.lifetimeDone-1);S.streak=Math.max(0,S.streak-1);}
  saveState();render();
}

  else{t.at='';S.lifetimeDone=Math.max(0,S.lifetimeDone-1);S.streak=Math.max(0,S.streak-1);}

function showQuickAdd(){document.getElementById('qaModal').classList.add('show');}
function closeQuickAdd(e){
  if(e && e.target!==document.getElementById('qaModal')) return;
  document.getElementById('qaModal').classList.remove('show');
}
function confirmQA(){
  var mod=parseInt(document.getElementById('qaMod').value);
  var name=document.getElementById('qaName').value.trim();
  var meta=document.getElementById('qaMeta').value.trim();
  if(!name){showToast('请输入任务名称');return;}
  if(mod===3){
    S.exer.push({name:name,dur:parseInt(meta)||30,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});
    S.mDone.f=true;addXP(3);
  }else if(mod===0){
    S.learn.push({id:'t'+(S.tidCtr++),title:name,meta:meta||'手动添加',tag:'tag-must',done:false,at:''});
  }else if(mod===1){
    S.work.push({id:'t'+(S.tidCtr++),title:name,meta:meta||'手动添加',tag:'tag-work',done:false,at:''});
  }else{
    S.life.push({id:'t'+(S.tidCtr++),title:name,meta:meta||'手动添加',tag:'tag-life',done:false,at:''});
  }
  document.getElementById('qaName').value='';document.getElementById('qaMeta').value='';
  closeQuickAdd();saveState();render();
}

function render(){

  var all=S.learn.concat(S.work).concat(S.life);
  var done=all.filter(function(t){return t.done;}).length;
  var total=all.length;
  var treePct=total>0?Math.round(done/total*100):0;

  document.getElementById('greeting').textContent=g+'！'+(total-done>0?'还有 '+(total-done)+' 项未完成':'今日任务已全部完成');

  var html='<div class="sec"><div class="sec-title">🎯 每日任务</div><div class="fs-12 text-sub mb-12">每日0:00重置·完成后自动获得XP+💎</div>';
  QUESTS.forEach(function(q){
    var done=!!S.qDoneD[q.id];
    var prog=0;
    if(q.cat==='water')prog=S.habits.water||0;
    else prog=S.qProg[q.id]||0;
    prog=Math.min(prog,q.tgt);
    html+='<div class="quest-item"><span class="quest-icon">'+q.icon+'</span><div class="flex-1"><span class="quest-name">'+q.name+'</span>'+(done?'':'<span class="quest-prog">'+prog+'/'+q.tgt+'</span>')+'</div>';
    html+='<span class="quest-reward">+'+q.xp+'XP'+(q.gems>0?' +'+q.gems+'💎':'')+'</span>';
    if(done)html+='<span class="quest-done">✓</span>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function renderHistory(){

  });

  html+='</div>';
  return html;
}

function scanOCR(i){
  var src=S.scanPhotos[i];
  if(!src)return;
  document.getElementById('ocrModal').style.display='flex';
  document.getElementById('ocrStatus').textContent='正在识别中，请稍候...';
  document.getElementById('ocrList').innerHTML='';
  Tesseract.recognize(src,'chi_sim+eng',{
    logger:function(m){if(m.status==='recognizing text'){document.getElementById('ocrStatus').textContent='正在识别: '+Math.round(m.progress*100)+'%';}}
  }).then(function(res){
    document.getElementById('ocrStatus').textContent='识别完成，共提取 '+res.data.words.length+' 个词。请核对并补全信息后录入。';
    parseOCRText(res.data.text);
  }).catch(function(e){
    document.getElementById('ocrStatus').textContent='识别失败: '+e.message;
    document.getElementById('ocrList').innerHTML='';
  });
}
function parseOCRText(text){
  var lines=text.split(/[\n\r]+/).map(function(l){return l.trim();}).filter(function(l){return l.length>1;});
  if(lines.length===0){document.getElementById('ocrList').innerHTML='<div style="text-align:center;color:#999;padding:20px">未识别到文字</div>';return;}
  S._ocrLines=lines.map(function(line,i){
    var parts=line.split(/[\s\|,，;；、\t]+/).filter(function(p){return p.length>0;});
    var subject=parts.length>=2?parts[0]:line;
    var chapter=parts.length>=2?parts.slice(1).join(' '):'';
    return {raw:line,subject:subject,chapter:chapter,checked:true};
  });
  renderOCRResults();
}
function renderOCRResults(){
  var el=document.getElementById('ocrList');
  el.innerHTML=S._ocrLines.map(function(item,i){
    return '<div class="ocr-row"><div class="ocr-raw">原文: '+item.raw+'</div><input type="checkbox" '+(item.checked?'checked':'')+' onchange="S._ocrLines['+i+'].checked=this.checked"><input type="text" placeholder="科目" value="'+item.subject.replace(/"/g,'&quot;')+'" onchange="S._ocrLines['+i+'].subject=this.value"><input type="text" placeholder="章节" value="'+item.chapter.replace(/"/g,'&quot;')+'" onchange="S._ocrLines['+i+'].chapter=this.value"><input type="number" placeholder="时长(h)" min="0.5" step="0.5" value="1" onchange="S._ocrLines['+i+'].hours=parseFloat(this.value)||1"></div>';
  }).join('');
}
function confirmOCR(){
  var added=0;
  S._ocrLines.forEach(function(item,i){
    if(!item.checked||!item.subject||!item.chapter)return;
    var h=item.hours||1;
    S.lmList.push({id:'lm'+(S.tidCtr++),s:item.subject,ch:item.chapter,h:h});
    added++;
  });
  S._ocrLines=[];
  document.getElementById('ocrModal').style.display='none';
  saveState();render();
  alert('已录入 '+added+' 条课程');
}
function cancelOCR(e){
  if(e&&e.target!==document.getElementById('ocrModal'))return;
  S._ocrLines=[];
  document.getElementById('ocrModal').style.display='none';
}
